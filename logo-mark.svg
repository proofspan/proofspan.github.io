<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="proofspan mark">
  <!-- The verification plane: a claim travels left to right, crosses the plane, and leaves confirmed. -->
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a66c4"/>
      <stop offset="0.5" stop-color="#3d8a9c"/>
      <stop offset="1" stop-color="#b85a86"/>
    </linearGradient>
  </defs>
  <path d="M6 40 C 16 40, 22 28, 32 28" fill="none" stroke="#171b15" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M32 28 C 40 28, 46 18, 58 14" fill="none" stroke="#2f6b4f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="url(#iris)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="28" r="4.2" fill="#f7f5ee" stroke="#171b15" stroke-width="2.4"/>
</svg>
